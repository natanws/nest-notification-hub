services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: notification_hub
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  app:
    build: .
    profiles: ['app']
    environment:
      DATABASE_URL: postgresql://hub:hub@postgres:5432/notification_hub?schema=public
      REDIS_URL: redis://redis:6379
      WEBHOOK_SIGNING_SECRET: change-me
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
